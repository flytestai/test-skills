<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#0d1729">
  <title>QDesk · 测试工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f6ef7'/%3E%3Cpath d='M32 13c-9.4 0-17 7.2-17 16.1 0 9 7.6 16.1 17 16.1 2.2 0 4.3-.4 6.2-1.1l7.6 6.2v-9.1A15.7 15.7 0 0 0 49 29.1C49 20.2 41.4 13 32 13zm-7.3 18.6-4.1-4.1 2.7-2.7 1.4 1.4 5-5 2.8 2.8-7.8 7.6zm13.8-.6h-7v-3.8h7v3.8z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="svg-sprite" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-6h5v6"/></symbol>
    <symbol id="i-tasks" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="3"/><path d="M9 4.5V3h6v1.5"/><path d="m8 11 1.6 1.6L13 8.8"/><path d="m8 17 1.6 1.6L13 14.8"/></symbol>
    <symbol id="i-bug" viewBox="0 0 24 24"><path d="M8 8.5a4 4 0 0 1 8 0v5a4 4 0 0 1-8 0z"/><path d="M9 9H5.5M15 9h3.5M9 13H5M15 13h4M9 17l-2.5 2M15 17l2.5 2M9 6 7.5 4M15 6l1.5-2M12 13v4"/></symbol>
    <symbol id="i-report" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 12h6M9 16h6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.7 2.7L16 9"/></symbol>
    <symbol id="i-alert-triangle" viewBox="0 0 24 24"><path d="M10.3 4.2 2.7 18a2 2 0 0 0 1.8 3h15a2 2 0 0 0 1.8-3L13.7 4.2a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="i-alert-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 17h.01"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></symbol>
    <symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></symbol>
    <symbol id="i-columns" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="16" rx="2"/><rect x="14" y="4" width="7" height="16" rx="2"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6.5 7.5V20l-3 1v-8.5Z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 21h16"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="m12 3 1.2 3.8L17 8l-3.8 1.2L12 13l-1.2-3.8L7 8l3.8-1.2Z"/><path d="m19 14 .7 2.3L22 17l-2.3.7L19 20l-.7-2.3L16 17l2.3-.7Z"/><path d="m5 14 .7 2.3L8 17l-2.3.7L5 20l-.7-2.3L2 17l2.3-.7Z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 6v5h-5"/><path d="M19.5 11A8 8 0 1 0 20 16"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.1-1.1"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="m20 13-7 7-9-9V4h7Z"/><circle cx="8.5" cy="8.5" r="1.5"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-1.5 4L16 12H5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.7 3.2 8 7.5 9.5 4.3-1.5 7.5-4.8 7.5-9.5V6Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l2.5-7 5 14L17 12h4"/></symbol>
    <symbol id="i-command" viewBox="0 0 24 24"><path d="M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3Z"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/><path d="M4 11.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M10.5 10h.01M14 10h.01M17.5 10h.01M7 14h.01M17 14h.01M10 14h4"/></symbol>
    <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7Z"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="i-trending" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-9"/><path d="M15 6h6v6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4Z"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M4 14h4l2 3h4l2-3h4"/></symbol>
    <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-2.9-.4-4.1-1L3 21l1.7-5.2A8.5 8.5 0 1 1 21 11.5Z"/></symbol>
  </svg>

  <div class="app-shell">
    <div class="sidebar-scrim" id="sidebar-scrim" data-action="close-sidebar"></div>
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span>Q</span></div>
        <div class="brand-text">
          <strong>QDesk</strong>
          <span>测试工作台</span>
        </div>
      </div>

      <div class="sprint-chip">
        <span class="sprint-dot"></span>
        <span id="sidebar-sprint">2026 Q4 · Sprint 1</span>
      </div>

      <nav class="nav-groups">
        <div class="nav-group">
          <p class="nav-label">工作区</p>
          <button class="nav-item" data-action="navigate" data-view="dashboard">
            <span class="nav-icon"><svg><use href="#i-home"></use></svg></span>
            <span>工作台</span>
          </button>
          <button class="nav-item" data-action="navigate" data-view="tasks">
            <span class="nav-icon"><svg><use href="#i-tasks"></use></svg></span>
            <span>任务管理</span>
            <span class="nav-count" id="nav-task-count">0</span>
          </button>
          <button class="nav-item" data-action="navigate" data-view="bugs">
            <span class="nav-icon"><svg><use href="#i-bug"></use></svg></span>
            <span>Bug 跟踪</span>
            <span class="nav-count nav-count-alert" id="nav-bug-count">0</span>
          </button>
          <button class="nav-item" data-action="navigate" data-view="reports">
            <span class="nav-icon"><svg><use href="#i-report"></use></svg></span>
            <span>工作日报</span>
          </button>
        </div>
        <div class="nav-group">
          <p class="nav-label">配置</p>
          <button class="nav-item" data-action="navigate" data-view="settings">
            <span class="nav-icon"><svg><use href="#i-settings"></use></svg></span>
            <span>偏好与数据</span>
          </button>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="storage-card">
          <div class="storage-icon"><svg><use href="#i-database"></use></svg></div>
          <div>
            <strong>禅道数据 · 本机服务</strong>
            <p id="sidebar-sync-text">正在连接禅道…</p>
          </div>
        </div>
        <div class="sidebar-user">
          <div class="avatar avatar-small" id="sidebar-avatar">QA</div>
          <div class="sidebar-user-text">
            <strong id="sidebar-name">测试工程师</strong>
            <span id="sidebar-role">测试开发工程师</span>
          </div>
          <button class="icon-btn icon-btn-ghost" data-action="navigate" data-view="settings" aria-label="打开设置">
            <svg><use href="#i-settings"></use></svg>
          </button>
        </div>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button class="icon-btn mobile-menu" data-action="open-sidebar" aria-label="打开菜单">
          <svg><use href="#i-menu"></use></svg>
        </button>
        <div class="topbar-heading">
          <p class="eyebrow" id="page-eyebrow">WORKSPACE / OVERVIEW</p>
          <h1 id="page-title">QDesk 工作台</h1>
          <p id="page-subtitle">把任务、缺陷与日报放在同一个节奏里。</p>
        </div>
        <div class="topbar-actions">
          <button class="sync-pill" id="sync-button" type="button" data-action="sync-zentao" title="从禅道 CLI 刷新任务与 Bug">
            <span class="sync-dot" id="sync-dot"></span>
            <span id="sync-label">禅道同步</span>
            <svg class="sync-icon"><use href="#i-refresh"></use></svg>
          </button>
          <button class="search-trigger" data-action="open-command" aria-label="搜索任务和 Bug">
            <svg><use href="#i-search"></use></svg>
            <span>搜索任务、Bug…</span>
            <kbd>Ctrl K</kbd>
          </button>
          <div class="quick-create">
            <button class="btn btn-primary quick-create-btn" data-action="toggle-quick-create" aria-expanded="false">
              <svg><use href="#i-plus"></use></svg>
              <span>新建</span>
              <svg class="caret"><use href="#i-chevron-down"></use></svg>
            </button>
            <div class="quick-menu" id="quick-create-menu" hidden>
              <p class="quick-menu-label">快速操作</p>
              <button data-action="sync-zentao"><span class="quick-icon tint-blue"><svg><use href="#i-refresh"></use></svg></span><span><strong>同步禅道</strong><small>刷新测试任务与 Bug</small></span></button>
              <button data-action="create-bug"><span class="quick-icon tint-red"><svg><use href="#i-bug"></use></svg></span><span><strong>登记 Bug</strong><small>选择产品后写入禅道</small></span></button>
              <button data-action="create-report"><span class="quick-icon tint-teal"><svg><use href="#i-report"></use></svg></span><span><strong>生成日报</strong><small>汇总今日任务与 Bug</small></span></button>
            </div>
          </div>
          <div class="notification-wrap">
            <button class="icon-btn notification-btn" id="notification-btn" data-action="toggle-notifications" aria-label="查看提醒">
              <svg><use href="#i-bell"></use></svg>
              <span class="notification-dot" id="notification-dot" hidden></span>
            </button>
            <div class="notification-panel" id="notification-panel" hidden></div>
          </div>
          <button class="avatar avatar-header" data-action="navigate" data-view="settings" id="header-avatar" aria-label="个人设置">QA</button>
        </div>
      </header>

      <main class="view-root" id="view-root" tabindex="-1"></main>
    </div>
  </div>

  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="command-root"></div>
  <div class="toast-stack" id="toast-root" role="status" aria-live="polite"></div>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
